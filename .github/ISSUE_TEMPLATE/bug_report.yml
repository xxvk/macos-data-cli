name: Bug report
description: Report a reproducible mpia-cli problem without exposing private data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Never include contact, message, calendar, reminder, photo, note, account,
        credential, private path, or opaque local identifier data.
  - type: input
    id: version
    attributes:
      label: mpia-cli version
      placeholder: "0.6.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: "macOS 26.x, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - Core / resources
        - Contacts
        - Mail
        - Calendar
        - Reminders
        - Photos
        - Notes
        - Installation / distribution
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe expected and actual behavior using redacted or synthetic values.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Privacy-safe reproduction
      description: Include the command shape and exit code, but redact all user data and local identifiers.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
      description: List relevant tests, doctor commands, or permission checks.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, credentials, private paths, account names, and opaque local identifiers.
          required: true
