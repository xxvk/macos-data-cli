name: Feature request
description: Propose a focused capability or adapter improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user or agent workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the CLI surface and expected JSON result without real user data.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy boundaries
      description: Identify permissions, write effects, confirmation, concurrency, and cleanup requirements.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This proposal does not require private frameworks or direct access to private macOS data stores.
          required: true
        - label: I removed personal data, credentials, account names, private paths, and local identifiers.
          required: true
